name: CI

# 推送任何分支或提交 PR 时编译检查（与 Release 相同的发布参数）：分支上编译通过再合并进 main、打 tag
on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build solution
        run: dotnet build BSTOAD.sln -c Release

      - name: Publish single-file exe (same as release)
        run: >
          dotnet publish src/Bstoad.Worker -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish
