name: Release

# 推送 v* 标签时自动构建单文件 exe 并发布到 GitHub Releases
# 用法: git tag v1.0.0 && git push --tags
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish single-file exe
        run: >
          dotnet publish src/Bstoad.Worker -c Release -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -o publish

      - name: Compute checksum
        shell: pwsh
        run: (Get-FileHash publish/Bstoad.Worker.exe -Algorithm SHA256).Hash > publish/Bstoad.Worker.exe.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            publish/Bstoad.Worker.exe
            publish/Bstoad.Worker.exe.sha256
          generate_release_notes: true
