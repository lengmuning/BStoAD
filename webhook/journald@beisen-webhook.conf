# beisen-webhook 专用 journald 命名空间 → /etc/systemd/journald@beisen-webhook.conf
# 只作用于设置了 LogNamespace=beisen-webhook 的两个服务，不影响系统和其他业务的日志策略。
# 查看：journalctl --namespace beisen-webhook -u beisen-webhook
[Journal]
Storage=persistent
# 最多保留 30 天；按天切分文件，过期按整天删除
MaxRetentionSec=30day
MaxFileSec=1day
# 按天切分时每个文件至少 8MB，31 天约 250MB；上限留足，确保按时间而不是按容量删除
SystemMaxUse=500M
